<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="theme-color" content="#0a0a1f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="GMS">
  <title>Worldengine</title>
  <link rel="icon" href="/favicon.ico" type="image/svg+xml">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css?v=30">
  <link rel="stylesheet" href="css/mobile.css?v=39">
</head>
<body class="m-body">
  <div id="m-app" class="m-app">
    <header id="m-header" class="m-header">
      <div class="m-header-left">
        <button class="m-header-btn" onclick="MobileApp.showNotifications()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span id="m-notify-badge" class="m-notify-badge" style="display:none;">0</span>
        </button>
      </div>
      <div class="m-header-center">
        <div class="m-header-title" id="m-header-title">运营系统</div>
      </div>
      <div class="m-header-right">
        <button class="m-header-btn" onclick="MobileApp.showGlobalSearch()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        </button>
      </div>
    </header>

    <main id="m-content" class="m-content">
      <div id="m-tab-home" class="m-tab-pane active"><div id="m-dashboard"></div></div>
      <div id="m-tab-ticket" class="m-tab-pane">
        <div class="m-sub-tabs">
          <button class="m-sub-tab active" data-filter="submit" onclick="MobileApp.switchOpsTab('ticket','submit')">提交技术支持</button>
          <button class="m-sub-tab" data-filter="mine" onclick="MobileApp.switchOpsTab('ticket','mine')">我的技术支持</button>
          <button class="m-sub-tab" data-filter="all" onclick="MobileApp.switchOpsTab('ticket','all')">全部技术支持</button>
        </div>
        <div id="m-ticket-content"></div>
      </div>
      <div id="m-tab-team" class="m-tab-pane"><div id="m-team-content"></div></div>
      <div id="m-tab-admin" class="m-tab-pane"><div id="m-ops-admin-grid"></div></div>
      <div id="m-tab-me" class="m-tab-pane"><div id="m-me-content"></div></div>
      <!-- Messages Tab -->
      <div id="m-tab-messages" class="m-tab-pane"></div>
      <!-- Full-screen Subpage View -->
      <div id="m-subpage-view" class="m-subpage-view" style="display:none">
        <div class="m-subpage-back" onclick="MobileApp.hideSubPageView()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="width:18px;height:18px"><path d="m15 18-6-6 6-6"/></svg>
          <span>返回</span>
        </div>
        <div id="m-subpage-content"></div>
        <div class="m-subpage-bottom" onclick="MobileApp.hideSubPageView()">
          <span>返回上一页</span>
        </div>
      </div>
    </main>

    <nav class="m-tabbar" id="m-tabbar">
      <button class="m-tab active" data-tab="home" onclick="MobileApp.switchTab('home')">
        <svg class="m-tab-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        <span class="m-tab-label">首页</span>
      </button>
      <button class="m-tab" data-tab="ticket" onclick="MobileApp.switchTab('ticket')">
        <svg class="m-tab-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><line x1="8" y1="2" x2="8" y2="4"/><line x1="16" y1="2" x2="16" y2="4"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
        <span class="m-tab-label">技术支持</span>
      </button>
      <button class="m-tab" data-tab="team" onclick="MobileApp.switchTab('team')">
        <svg class="m-tab-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span class="m-tab-label">团队</span>
      </button>
      <button class="m-tab" data-tab="admin" onclick="MobileApp.switchTab('admin')">
        <svg class="m-tab-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span class="m-tab-label">管理</span>
      </button>
      <button class="m-tab" data-tab="me" onclick="MobileApp.switchTab('me')">
        <svg class="m-tab-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span class="m-tab-label">我的</span>
      </button>
    </nav>

    <button id="m-fab" class="m-fab" onclick="MobileApp.showNewTicketForm()">+</button>
  </div>

  <div id="m-modal" class="m-modal" style="display:none;">
    <div class="m-modal-mask" onclick="MobileApp.closeModal()"></div>
    <div class="m-modal-body" id="m-modal-body"></div>
  </div>
  <div id="m-toast" class="m-toast"></div>

  <script src="js/utils.js?v=1"></script>
  <script src="js/api.js?v=40"></script>
  <script src="js/mobile.js?v=120"></script>
</body>
</html>
