# console/kiosk 都是客户端路由（react-router），不是磁盘上的真实路径，
# 默认 nginx 配置会对 /console 这类路径直接 404——落到 index.html 交给前端接管。
# /api 前缀在这里剥掉再转发给 api 服务，跟 frontend/vite.config.ts 的本地开发代理是同一个约定，
# 见 docs/api-design.md 待定问题 A1。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
