[project]
name = "galio-backend"
version = "0.1.0"
description = "Galio 服务端：api 与 worker 两种进程形态共享同一代码库，见 docs/architecture.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
# B008: FastAPI 的 Depends(...)/Query(...) 惯用写法就是函数默认值里调用，不是 bug。
ignore = ["B008"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
