# ===================================================================
#  Yunwei Complete Stack — i9 Workstation Production Edition
#  包含: Nginx + PM2 App + MySQL + Redis + Prometheus + Grafana
# ===================================================================
version: '3.8'

services:
  # ========== MySQL 8.0 (高并发优化) ==========
  mysql:
    image: mysql:8.0
    container_name: yunwei-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD required (set in .env)}
      MYSQL_DATABASE: gms
      MYSQL_USER: Wuzhenyu
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required (set in .env)}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:3306:3306"
    command: >
      --max_connections=800
      --innodb_buffer_pool_size=2G
      --innodb_log_file_size=512M
      --innodb_flush_log_at_trx_commit=2
      --innodb_flush_method=O_DIRECT
      --innodb_io_capacity=2000
      --innodb_io_capacity_max=4000
      --innodb_read_io_threads=8
      --innodb_write_io_threads=8
      --innodb_buffer_pool_instances=8
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_allowed_packet=256M
      --thread_cache_size=64
      --table_open_cache=4000
      --sort_buffer_size=4M
      --join_buffer_size=4M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - yunwei-net

  # ========== MySQL Exporter (Prometheus 指标) ==========
  mysql-exporter:
    image: prom/mysqld-exporter:latest
    container_name: yunwei-mysql-exporter
    restart: always
    environment:
      DATA_SOURCE_NAME: "Wuzhenyu:${DB_PASSWORD:?DB_PASSWORD required (set in .env)}@(mysql:3306)/gms"
    depends_on:
      - mysql
    ports:
      - "127.0.0.1:9104:9104"
    networks:
      - yunwei-net

  # ========== Redis 7 (缓存 + Pub/Sub) ==========
  redis:
    image: redis:7-alpine
    container_name: yunwei-redis
    restart: always
    command: >
      redis-server
      --appendonly yes
      --maxmemory 4gb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
      --tcp-backlog 511
      --timeout 300
      --tcp-keepalive 300
      --databases 4
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    sysctls:
      - net.core.somaxconn=1024
    networks:
      - yunwei-net

  # ========== Redis Exporter ==========
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: yunwei-redis-exporter
    restart: always
    environment:
      REDIS_ADDR: "redis://redis:6379"
    depends_on:
      - redis
    ports:
      - "127.0.0.1:9121:9121"
    networks:
      - yunwei-net

  # ========== Node.js App (PM2 集群) ==========
  app:
    build: .
    container_name: yunwei-app
    restart: always
    environment:
      NODE_ENV: production
      PORT: 8765
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: Wuzhenyu
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required (set in .env)}
      DB_NAME: gms
      REDIS_HOST: redis
      REDIS_PORT: 6379
      EDGE_TOKEN: ${EDGE_TOKEN:?EDGE_TOKEN required for machine agents}
      FEISHU_APP_ID: ${FEISHU_APP_ID:-cli_aaa42355f0389cfc}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:?FEISHU_APP_SECRET required (set in .env)}
      # SZX3 多维表格 + 运维通知群机器人
      FEISHU_APP_TOKEN: ${FEISHU_APP_TOKEN:-Lo7mb8Virax0k2smZticmh6JnAg}
      FEISHU_TABLE_ID: ${FEISHU_TABLE_ID:-tblJ65qGy7te8NC5}
      FEISHU_WEBHOOK: ${FEISHU_WEBHOOK:-https://open.feishu.cn/open-apis/bot/v2/hook/7a28653d-43b8-4586-a840-6736816304fb}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_DIR: /var/log/yunwei
    ports:
      - "8765:8765"
    volumes:
      - uploads_data:/app/uploads
      - log_data:/var/log/yunwei
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8765/api/health',r=>{process.exit(r.statusCode===200?0:1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
    # 资源限制 (i9 宽松配置)
    deploy:
      resources:
        limits:
          cpus: '12'
          memory: 16G
        reservations:
          cpus: '4'
          memory: 4G
    networks:
      - yunwei-net

  # ========== Nginx 反向代理 ==========
  nginx:
    image: nginx:alpine
    container_name: yunwei-nginx
    restart: always
    ports:
      - "8088:80"
      - "443:443"
    volumes:
      - ./nginx-prod.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - yunwei-net

  # ========== Prometheus 监控 ==========
  prometheus:
    image: prom/prometheus:latest
    container_name: yunwei-prometheus
    restart: always
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - yunwei-net

  # ========== Grafana 可视化 ==========
  grafana:
    image: grafana/grafana:latest
    container_name: yunwei-grafana
    restart: always
    environment:
      GF_SERVER_ROOT_URL: http://localhost:3000
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-yunwei2026}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-dashboard.json:/etc/grafana/provisioning/dashboards/yunwei.json:ro
    ports:
      - "3000:3000"
    networks:
      - yunwei-net

  # ========== Node Exporter (主机监控) ==========
  node-exporter:
    image: prom/node-exporter:latest
    container_name: yunwei-node-exporter
    restart: always
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.ignored-mount-points=^(sys|proc|dev|run)($$|/)'
    ports:
      - "127.0.0.1:9100:9100"
    networks:
      - yunwei-net

# ==================== VOLUMES ====================
volumes:
  mysql_data:
  redis_data:
  uploads_data:
  log_data:
  nginx_logs:
  prometheus_data:
  grafana_data:

# ==================== NETWORKS ====================
networks:
  yunwei-net:
    driver: bridge
