  <script>
  // 移动端重定向（须同步执行，避免桌面内容闪现）
  (function(){
    try {
      var isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth < 768;
      if (!isMobile) return;
      var user = null;
      try { user = JSON.parse(localStorage.getItem('gms_user') || 'null'); } catch (e) {}
      if (user && user.system === 'operations' && user.role !== 'superadmin') {
        location.replace('mobile-ops.html');
      } else {
        location.replace('mobile.html');
      }
    } catch (e) {
      location.replace('mobile.html');
    }
  })();
  </script>
